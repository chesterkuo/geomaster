<!DOCTYPE html>
<html>
<head>
    <style>
        /* FORCE REACT APP TO TOP */
        body > *:not(#root) {
            display: none !important;
            visibility: hidden !important;
            z-index: -1 !important;
        }
        
        #root {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 2147483647 !important;
            background: #0f172a !important;
        }
        
        /* FORCE VISIBILITY TEST */
        .react-visibility-test {
            position: fixed !important;
            top: 20px !important;
            right: 20px !important;
            width: 20px !important;
            height: 20px !important;
            background: #00ff00 !important;
            border-radius: 50% !important;
            z-index: 2147483647 !important;
            animation: pulse 1s infinite !important;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="react-visibility-test"></div>
    <script>
        console.log('FORCE REACT SCRIPT LOADED');
        // Hide all other elements
        document.body.childNodes.forEach(node => {
            if (node.nodeType === 1 && node.id !== 'root' && !node.classList.contains('react-visibility-test')) {
                node.style.display = 'none';
                node.style.visibility = 'hidden';
                node.style.zIndex = '-1';
            }
        });
    </script>
</body>
</html>
